# Cloud Build recipe for the server image.
#
# An explicit config rather than `builds submit --tag` so the build args
# (version, build date, revision) are named here and not on a command line
# someone has to remember. The Dockerfile lives at the repository root and the
# context is the repository root: the server imports internal/event and
# internal/health, which the client also uses, so building from the deploy
# directory would silently exclude them.
#
# The release workflow (examples/deploy-gcp/release.yml.example) and a release engineer's
# laptop both build the image from this file, so the two cannot drift: the
# same Dockerfile, the same build args, the same tag shape. Building here
# rather than on the laptop also removes the one mistake README.md 7 warns
# about (an arm64 image that Cloud Run accepts and cannot start), because the
# builder is linux/amd64.
#
# Substitutions:
#   _TAG    the 7-character git sha stamped into the binary as its version
#   _IMAGE  the full Artifact Registry path the image is pushed to
#
# The build date is the commit time in UTC, the same rule the Makefile uses
# for the client binaries, so an image and the client built from one commit
# carry one instant; REVISION is the full sha the OCI label records.
#
# Usage from the repository root (the build context; the Dockerfile says why):
#   gcloud builds submit --project=__PROJECT__ --region=__REGION__ \
#     --config=examples/deploy-gcp/cloudbuild.yaml \
#     --substitutions=_TAG=<sha>,_IMAGE=__REGION__-docker.pkg.dev/__PROJECT__/loop-sessions/server:<sha> .
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env:
      - DOCKER_BUILDKIT=1
    args:
      - -ceu
      - |
        docker build \
          --build-arg VERSION="${_TAG}" \
          --build-arg BUILD_DATE="$(TZ=UTC git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)" \
          --build-arg REVISION="$(git rev-parse HEAD)" \
          -t "${_IMAGE}" \
          .
images:
  - ${_IMAGE}
substitutions:
  _TAG: dev
  _IMAGE: __REGION__-docker.pkg.dev/__PROJECT__/loop-sessions/server:dev
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
